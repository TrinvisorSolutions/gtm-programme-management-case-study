<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="1" stop-color="#101c31"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity=".22"/></filter></defs><rect width="1600" height="720" rx="32" fill="url(#bg)"/><text x="90" y="85" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#f8fafc">EMEA GTM Programme Operating Model</text><text x="90" y="125" font-family="Arial, sans-serif" font-size="18" fill="#94a3b8">Customer engagement → credible evidence → sales activation → measurable learning</text><g font-family="Arial, sans-serif" filter="url(#shadow)"><g><rect x="90" y="220" width="210" height="130" rx="24" fill="#102a43" stroke="#38bdf8"/><text x="195" y="265" text-anchor="middle" font-size="18" font-weight="700" fill="#e2e8f0">1. Source</text><text x="195" y="300" text-anchor="middle" font-size="15" fill="#cbd5e1">Identify customer</text><text x="195" y="323" text-anchor="middle" font-size="15" fill="#cbd5e1">advocates / references</text></g><g><rect x="345" y="220" width="210" height="130" rx="24" fill="#102a43" stroke="#60a5fa"/><text x="450" y="265" text-anchor="middle" font-size="18" font-weight="700" fill="#e2e8f0">2. Qualify</text><text x="450" y="300" text-anchor="middle" font-size="15" fill="#cbd5e1">Fit, consent, value</text><text x="450" y="323" text-anchor="middle" font-size="15" fill="#cbd5e1">and readiness</text></g><g><rect x="600" y="220" width="210" height="130" rx="24" fill="#102a43" stroke="#818cf8"/><text x="705" y="265" text-anchor="middle" font-size="18" font-weight="700" fill="#e2e8f0">3. Engage</text><text x="705" y="300" text-anchor="middle" font-size="15" fill="#cbd5e1">Peer session /</text><text x="705" y="323" text-anchor="middle" font-size="15" fill="#cbd5e1">customer interaction</text></g><g><rect x="855" y="220" width="210" height="130" rx="24" fill="#102a43" stroke="#a78bfa"/><text x="960" y="265" text-anchor="middle" font-size="18" font-weight="700" fill="#e2e8f0">4. Capture</text><text x="960" y="300" text-anchor="middle" font-size="15" fill="#cbd5e1">Insight, proof and</text><text x="960" y="323" text-anchor="middle" font-size="15" fill="#cbd5e1">story content</text></g><g><rect x="1110" y="220" width="210" height="130" rx="24" fill="#102a43" stroke="#f472b6"/><text x="1215" y="265" text-anchor="middle" font-size="18" font-weight="700" fill="#e2e8f0">5. Approve</text><text x="1215" y="300" text-anchor="middle" font-size="15" fill="#cbd5e1">Customer / legal /</text><text x="1215" y="323" text-anchor="middle" font-size="15" fill="#cbd5e1">brand sign-off</text></g><g><rect x="1365" y="220" width="145" height="130" rx="24" fill="#102a43" stroke="#34d399"/><text x="1437" y="265" text-anchor="middle" font-size="18" font-weight="700" fill="#e2e8f0">6. Activate</text><text x="1437" y="300" text-anchor="middle" font-size="15" fill="#cbd5e1">Sales +</text><text x="1437" y="323" text-anchor="middle" font-size="15" fill="#cbd5e1">marketing</text></g></g><g stroke="#64748b" stroke-width="4" fill="none"><path d="M300 285H345"/><path d="M555 285H600"/><path d="M810 285H855"/><path d="M1065 285H1110"/><path d="M1320 285H1365"/></g><g fill="#64748b"><polygon points="340,279 352,285 340,291"/><polygon points="595,279 607,285 595,291"/><polygon points="850,279 862,285 850,291"/><polygon points="1105,279 1117,285 1105,291"/><polygon points="1360,279 1372,285 1360,291"/></g><rect x="90" y="455" width="1420" height="150" rx="28" fill="#0d253c" stroke="#1e3a5f"/><text x="120" y="500" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#38bdf8">PROGRAMME MANAGEMENT LAYER</text><text x="120" y="540" font-family="Arial, sans-serif" font-size="20" fill="#e2e8f0">Integrated planning   •   governance   •   RAID   •   dependencies   •   KPI reporting   •   stakeholder cadence   •   continuous improvement</text><text x="120" y="578" font-family="Arial, sans-serif" font-size="16" fill="#94a3b8">The Programme Manager keeps the entire system synchronised - not just individual tasks.</text></svg>